<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Linux Digital Detective</title>
<style>
:root{color-scheme:dark;--bg:#07090d;--panel:#0f131a;--line:#212936;--text:#f4f7fb;--muted:#8d99aa;--ok:#55d68b;--warn:#ffbf5c;--bad:#ff6b6b;--accent:#7c9cff}*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui;background:radial-gradient(circle at 85% 10%,#14203a 0,transparent 35%),var(--bg);color:var(--text)}main{max-width:1220px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.brand h1{margin:0;font-size:28px;letter-spacing:-.03em}.brand p{margin:4px 0 0;color:var(--muted)}.pill{border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#0b0f15}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--warn)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,#111720,#0d1118);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 14px 40px #0006}.metric{grid-column:span 3}.metric .v{font-size:30px;font-weight:750;margin-top:5px}.metric .k{color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.13em}.chart{grid-column:span 8}.side{grid-column:span 4}.incidents{grid-column:span 12}.bar{height:8px;background:#1b2330;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:linear-gradient(90deg,var(--accent),#a779ff);width:0}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #1c2330}.row:last-child{border-bottom:0}.sev{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid}.sev.info{color:var(--ok)}.sev.warning{color:var(--warn)}.sev.high,.sev.critical{color:var(--bad)}canvas{width:100%;height:250px}.muted{color:var(--muted)}a{color:#abc0ff;text-decoration:none}@media(max-width:850px){.metric{grid-column:span 6}.chart,.side,.incidents{grid-column:span 12}}@media(max-width:520px){main{padding:16px}.metric{grid-column:span 12}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><main><div class="top"><div class="brand"><h1>Linux Digital Detective</h1><p>Live host health, incident timeline, and forensic evidence.</p></div><div class="pill"><span class="dot" id="statusDot"></span><span id="statusText">Connecting…</span></div></div>
<div class="grid">
<div class="card metric"><div class="k">CPU</div><div class="v" id="cpu">—</div><div class="bar"><div class="fill" id="cpuBar"></div></div></div>
<div class="card metric"><div class="k">Memory</div><div class="v" id="mem">—</div><div class="bar"><div class="fill" id="memBar"></div></div></div>
<div class="card metric"><div class="k">Disk</div><div class="v" id="disk">—</div><div class="bar"><div class="fill" id="diskBar"></div></div></div>
<div class="card metric"><div class="k">Forensics</div><div class="v" id="forensics">—</div><div class="muted" id="service">waiting for agent</div></div>
<div class="card chart"><div class="k muted">Live trend · CPU / Memory / Disk</div><canvas id="chart" width="760" height="250"></canvas></div>
<div class="card side"><div class="k muted">System state</div><div class="row"><span>Service</span><strong id="serviceState">—</strong></div><div class="row"><span>Port</span><strong id="portState">—</strong></div><div class="row"><span>Incidents</span><strong id="incidentCount">—</strong></div><div class="row"><span>API</span><a href="/docs">Open docs ↗</a></div><div class="row"><span>Prometheus</span><a href="/metrics">/metrics ↗</a></div></div>
<div class="card incidents"><div class="k muted">Recent incidents</div><div id="incidentList"><div class="row muted">No incidents loaded yet.</div></div></div>
</div></main>
<script>
const $=id=>document.getElementById(id),pct=v=>`${Number(v||0).toFixed(1)}%`;function setBar(id,v){$(id).style.width=`${Math.min(100,Math.max(0,Number(v||0)))}%`}function draw(rows){const c=$('chart'),x=c.getContext('2d'),w=c.width,h=c.height;x.clearRect(0,0,w,h);x.strokeStyle='#263245';for(let i=1;i<5;i++){let y=h*i/5;x.beginPath();x.moveTo(0,y);x.lineTo(w,y);x.stroke()}[['cpu_percent','#7c9cff'],['memory_percent','#55d68b'],['disk_percent','#ffbf5c']].forEach(([k,color])=>{x.strokeStyle=color;x.lineWidth=2;x.beginPath();rows.forEach((r,i)=>{let px=rows.length<2?0:i*(w/(rows.length-1)),py=h-(Number(r[k]||0)/100*h);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()})}
async function refresh(){try{const [s,m,i]=await Promise.all([fetch('/api/summary').then(r=>r.json()),fetch('/api/metrics?limit=90').then(r=>r.json()),fetch('/api/incidents?limit=12').then(r=>r.json())]);const l=s.latest;if(l){$('cpu').textContent=pct(l.cpu_percent);$('mem').textContent=pct(l.memory_percent);$('disk').textContent=pct(l.disk_percent);setBar('cpuBar',l.cpu_percent);setBar('memBar',l.memory_percent);setBar('diskBar',l.disk_percent);$('service').textContent=`${l.hostname||'host'} · ${l.service||'service'}`;$('serviceState').textContent=l.service_running?'UP':'DOWN';$('portState').textContent=`${l.monitored_port||80} ${l.port_listening?'OPEN':'CLOSED'}`;const healthy=l.service_running&&l.port_listening;$('statusText').textContent=healthy?'Monitoring healthy':'Attention needed';$('statusDot').style.background=healthy?'var(--ok)':'var(--bad)'}$('forensics').textContent=s.forensic_count;$('incidentCount').textContent=s.incident_count;draw(m);$('incidentList').innerHTML=i.length?i.map(e=>`<div class="row"><div><strong>${e.type}</strong><div class="muted">${e.message||''}</div></div><div><span class="sev ${e.severity||'info'}">${e.severity||'info'}</span><div class="muted">${new Date(e.timestamp).toLocaleTimeString()}</div></div></div>`).join(''):'<div class="row muted">No incidents yet.</div>'}catch(e){$('statusText').textContent='API unavailable';$('statusDot').style.background='var(--bad)'}}refresh();setInterval(refresh,3000);
</script></body></html>
